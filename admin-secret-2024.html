<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e7d32">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <title>Campus Bazaar - Admin</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="shop-body">

  <header class="shop-header">
    <h1>Admin Panel</h1>
    <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
  </header>

  <!-- Tabs -->
  <div class="admin-tabs">
    <button class="admin-tab active" onclick="showAdminTab('orders')">Orders</button>
    <button class="admin-tab" onclick="showAdminTab('products')">Products</button>
    <button class="admin-tab" onclick="showAdminTab('settings')">Settings</button>
    <button class="admin-tab" onclick="showAdminTab('reports')">Reports</button>
  </div>

  <!-- Orders Section -->
  <div id="admin-orders" class="admin-section">
    <div class="admin-container">
      <div id="admin-orders-list"><p class="loading">Loading orders...</p></div>
    </div>
  </div>

  <!-- Products Section -->
  <div id="admin-products" class="admin-section" style="display:none">
    <div class="admin-container">
      <h2>Manage Products</h2>
      <div id="admin-products-list"><p class="loading">Loading products...</p></div>
    </div>
  </div>

  <!-- Settings Section -->
  <div id="admin-settings" class="admin-section" style="display:none">
    <div class="admin-container">
      <h2>Settings</h2>
      <div class="settings-row">
        <label>Order Cutoff Time</label>
        <input type="time" id="cutoff-time-input" />
        <button onclick="saveCutoffTime()">Save</button>
        <p id="settings-message" class="message"></p>
      </div>
      <div class="settings-row">
        <label>Shop Status</label>
        <button id="shop-toggle-btn" onclick="toggleShop()">Loading...</button>
        <p id="shop-status-message" class="message"></p>
      </div>
    </div>
  </div>

  <!-- Reports Section -->
  <div id="admin-reports" class="admin-section" style="display:none">
    <div class="admin-container">
      <h2>Reports</h2>
      <div style="display:flex; gap:12px; margin-top:16px;">
        <button class="btn-report" onclick="generatePurchaseReport()">Generate Purchase Report</button>
        <button class="btn-report" onclick="generatePackingList()">Generate Packing List</button>
      </div>
      <div id="report-output"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=2"></script>
  <script src="js/admin.js?v=2"></script>
</body>
</html>
