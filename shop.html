<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e7d32">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
  <title>Campus Bazaar - Shop</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body class="shop-body">

  <!-- Header -->
  <header class="shop-header">
    <div class="header-left">
      <h1>Campus Bazaar</h1>
    </div>
    <div class="header-right">
      <button class="cart-btn" onclick="window.location.href='cart.html'">
        🛒 Cart <span id="cart-count">0</span>
      </button>
      <button class="logout-btn" onclick="logoutUser()">Logout</button>
    </div>
  </header>

  <div id="shop-closed-banner" class="shop-banner" style="display:none">
    ⛔ Orders are closed for today. Please come back tomorrow morning.
  </div>

  <!-- Category Tabs -->
  <div class="category-tabs">
    <button class="cat-tab active" onclick="filterCategory('All')">All</button>
    <button class="cat-tab" onclick="filterCategory('Vegetable')">Vegetables</button>
    <button class="cat-tab" onclick="filterCategory('Fruit')">Fruits</button>
    <button class="cat-tab" onclick="filterCategory('Meat')">Meat</button>
    <button class="cat-tab" onclick="filterCategory('Dairy')">Dairy</button>
    <button class="cat-tab" onclick="filterCategory('Seafood')">Seafood</button>
    <button class="cat-tab" onclick="filterCategory('Spice')">Spices</button>
    <button class="cat-tab" onclick="filterCategory('Herb')">Herbs</button>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <input type="search" id="product-search" placeholder="Search products…" autocomplete="off" aria-label="Search products" />
  </div>

  <!-- Products Grid -->
  <div class="products-grid" id="products-grid">
    <p class="loading">Loading products...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js?v=2"></script>
  <script src="js/shop.js?v=2"></script>
</body>
</html>
